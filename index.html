<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSV Lens</title>
<meta name="description" content="递归分析一个根目录下的所有 CSV，支持插件：按 CSV 类型计算衍生特征、绘制专属子图。">
<script>
  // 尽早确定主题，避免闪烁
  (function () {
    var t = null;
    try { t = localStorage.getItem('csvlens.theme'); } catch (e) { /* storage blocked */ }
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
:root {
  color-scheme: light;
  --font: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, monospace;
  --bg: #f4f4f1;
  --surface: #fcfcfb;
  --surface-2: #f3f2ee;
  --surface-3: #e9e8e2;
  --border: rgba(11, 11, 11, 0.09);
  --border-strong: rgba(11, 11, 11, 0.16);
  --text: #0b0b0b;
  --text-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --accent: #2a78d6;
  --accent-ink: #1c5cab;
  --accent-soft: rgba(42, 120, 214, 0.10);
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --div-neg: #2a78d6; --div-mid: #f0efec; --div-pos: #e34948;
  --seq-lo: #cde2fb; --seq-hi: #104281;
  --shadow: 0 1px 2px rgba(16, 16, 16, 0.04), 0 4px 14px rgba(16, 16, 16, 0.04);
  --radius: 12px;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0d0d;
  --surface: #1a1a19;
  --surface-2: #222220;
  --surface-3: #2c2c2a;
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.16);
  --text: #f0efec;
  --text-2: #c3c2b7;
  --muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --accent: #3987e5;
  --accent-ink: #86b6ef;
  --accent-soft: rgba(57, 135, 229, 0.16);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --div-neg: #3987e5; --div-mid: #383835; --div-pos: #e66767;
  --seq-lo: #1c3350; --seq-hi: #86b6ef;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.mono { font-family: var(--mono); }
[hidden] { display: none !important; }

/* ---------- layout ---------- */
.app {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  grid-template-rows: 56px minmax(0, 1fr);
  height: 100vh;
}
.topbar {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 16px;
  padding: 0 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  z-index: 10;
}
.brand { display: flex; align-items: center; gap: 10px; flex: none; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 8px; flex: none;
  display: grid; place-items: center;
  background: linear-gradient(135deg, #2a78d6, #6250d6);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18);
}
.brand-name { font-weight: 650; font-size: 15px; letter-spacing: 0.01em; line-height: 1.2; }
.brand-sub { font-size: 11.5px; color: var(--muted); line-height: 1.2; }
.topbar-root { flex: 1; min-width: 0; display: flex; align-items: center; }
.root-pill {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  height: 28px; padding: 0 10px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-2); font-size: 12.5px; white-space: nowrap; overflow: hidden;
}
.root-pill b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }

.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; min-height: 0;
}
.main { overflow: auto; min-width: 0; position: relative; }
.page { max-width: 1480px; margin: 0 auto; padding: 24px 28px 72px; }

/* ---------- controls ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 32px; padding: 0 12px; border-radius: 8px;
  border: 1px solid transparent; background: var(--accent); color: #fff;
  font-size: 13px; font-weight: 560; cursor: pointer; white-space: nowrap;
  transition: background-color 0.15s, border-color 0.15s, filter 0.15s;
}
.btn:hover { filter: brightness(1.07); }
.btn.ghost { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn.ghost:hover { background: var(--surface-2); filter: none; }
.btn.subtle { background: transparent; color: var(--text-2); }
.btn.subtle:hover { background: var(--surface-2); color: var(--text); filter: none; }
.btn.danger { background: transparent; color: var(--critical); border-color: color-mix(in srgb, var(--critical) 40%, transparent); }
.btn.danger:hover { background: color-mix(in srgb, var(--critical) 8%, transparent); filter: none; }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 6px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; filter: none; }
.btn .count {
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
  background: var(--surface-3); color: var(--text-2);
  font-size: 11px; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums;
}
.icon-btn {
  display: inline-grid; place-items: center; flex: none;
  width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid transparent; background: transparent; color: var(--text-2);
  cursor: pointer;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn:disabled { opacity: 0.35; cursor: not-allowed; background: transparent; }
.icon-btn.sm { width: 24px; height: 24px; border-radius: 6px; }
.ico { display: inline-flex; line-height: 0; flex: none; }
.input {
  height: 30px; padding: 0 8px; border-radius: 7px;
  border: 1px solid var(--border-strong); background: var(--surface);
  font-size: 12.5px; color: var(--text); outline: none; min-width: 0;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
input.input[type="number"] { width: 88px; }
select.input { padding-right: 4px; max-width: 240px; }
.field { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); }
.field input[type="checkbox"] { accent-color: var(--accent); margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  height: 24px; padding: 0 9px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--text-2); font-size: 12px; cursor: pointer; white-space: nowrap;
}
.chip:hover { background: var(--surface-2); color: var(--text); }
.chip.on { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--text); }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip.static { cursor: default; }
.chip.static:hover { background: var(--surface); color: var(--text-2); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c, var(--muted)); }
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  height: 22px; padding: 0 8px; border-radius: 6px;
  background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text-2); font-size: 12px; white-space: nowrap;
}
.kbd { font-family: var(--mono); font-size: 11px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--border-strong); background: var(--surface-2); }
.switch { position: relative; width: 34px; height: 20px; flex: none; }
.switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; z-index: 1; }
.switch i { position: absolute; inset: 0; border-radius: 10px; background: var(--surface-3); transition: background-color 0.15s; }
.switch i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform 0.15s; }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(14px); }
.switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
.progress { height: 4px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.progress > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width 0.2s; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--surface-3); border-top-color: var(--accent); animation: spin 0.8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- sidebar ---------- */
.sidebar-head { padding: 12px 12px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--border); }
.search {
  display: flex; align-items: center; gap: 8px;
  height: 34px; padding: 0 10px; border-radius: 8px;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
}
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 13px; color: var(--text); }
.scan { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--text-2); }
.tree { flex: 1; overflow: auto; padding: 6px 6px 16px; }
.tree-row {
  position: relative;
  display: flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 8px 0 calc(8px + var(--depth, 0) * 14px);
  border-radius: 7px; cursor: pointer; user-select: none;
  color: var(--text-2); font-size: 13px;
}
.tree-row:hover { background: var(--surface-2); color: var(--text); }
.tree-row.active { background: var(--accent-soft); color: var(--text); }
.tree-row.active::before { content: ''; position: absolute; left: 1px; top: 7px; bottom: 7px; width: 3px; border-radius: 3px; background: var(--accent); }
.tree-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-row .meta { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; flex: none; }
.tree-row.folder { color: var(--text); font-weight: 560; }
.tree-row.folder .ico.f { color: var(--muted); }
.tree-row .chev { color: var(--muted); transition: transform 0.15s; display: inline-flex; width: 16px; justify-content: center; }
.tree-row.open .chev { transform: rotate(90deg); }
.tree-row .ico.file { color: var(--muted); }
.tree-row.error .name { color: var(--critical); }
.tree-row .dots { display: inline-flex; gap: 3px; flex: none; }
.tree-row .dots .dot { width: 7px; height: 7px; }
.tree-row input[type="checkbox"] { margin: 0; width: 14px; height: 14px; accent-color: var(--accent); opacity: 0; flex: none; cursor: pointer; }
.tree-row:hover input[type="checkbox"], .tree-row input[type="checkbox"]:checked, .tree.selecting .tree-row input[type="checkbox"] { opacity: 1; }
.tree-empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.sidebar-foot {
  border-top: 1px solid var(--border); padding: 10px 12px;
  display: flex; align-items: center; gap: 8px;
  font-size: 12.5px; color: var(--text-2); background: var(--surface);
}

/* ---------- page parts ---------- */
.page-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.crumbs button { border: 0; background: none; padding: 0 3px; border-radius: 4px; color: var(--text-2); cursor: pointer; }
.crumbs button:hover { color: var(--accent-ink); background: var(--surface-2); }
h1.title { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.3; word-break: break-all; }
.subtitle { color: var(--muted); font-size: 13px; margin-top: 2px; }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.card-title { font-weight: 620; font-size: 14.5px; }
.card-sub { color: var(--muted); font-size: 12.5px; }
.card-body { padding: 16px 18px; }
.card-body.flush { padding: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.tile { padding: 12px 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); min-width: 0; }
.tiles.on-card .tile { background: var(--surface-2); border-color: transparent; }
.tile .label { font-size: 12px; color: var(--text-2); }
.tile .value { font-size: 21px; font-weight: 620; margin-top: 2px; line-height: 1.25; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.tile .value .unit { font-size: 12.5px; font-weight: 500; color: var(--muted); margin-left: 3px; }
.tile .hint { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.empty { padding: 40px 20px; text-align: center; color: var(--text-2); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .ico { color: var(--muted); }
.empty h3 { margin: 0; font-size: 15px; color: var(--text); }
.empty p { margin: 0; max-width: 520px; font-size: 13px; color: var(--muted); }
.loading { display: flex; align-items: center; gap: 10px; padding: 28px 4px; color: var(--text-2); font-size: 13px; }
.err {
  border: 1px solid color-mix(in srgb, var(--critical) 38%, transparent);
  background: color-mix(in srgb, var(--critical) 7%, transparent);
  border-radius: 8px; padding: 10px 12px; font-size: 12.5px;
  display: flex; gap: 8px; align-items: flex-start; color: var(--text);
}
.err .ico { color: var(--critical); margin-top: 2px; }
.err pre { margin: 4px 0 0; font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; word-break: break-word; color: var(--text-2); }
.hint-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin: -4px 0 14px; }

/* tabs */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 18px; overflow-x: auto; }
.tab {
  position: relative; display: inline-flex; align-items: center; gap: 6px;
  height: 40px; padding: 0 14px; border: 0; background: transparent;
  color: var(--text-2); font-size: 13.5px; font-weight: 560; cursor: pointer; white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.on { color: var(--text); }
.tab.on::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
.tab .badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--surface-3); color: var(--text-2); font-size: 11px; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }

/* charts */
.chart-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px 8px; min-width: 0; }
.chart-card.span-2 { grid-column: 1 / -1; }
.chart-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; min-height: 22px; }
.chart-title { font-weight: 600; font-size: 13.5px; }
.chart-sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chart { width: 100%; position: relative; }
.chart-msg { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center; color: var(--muted); font-size: 12.5px; }
.chart-msg.bad { color: var(--critical); }

/* plugin sections */
.psec { overflow: hidden; }
.psec-head { display: flex; align-items: flex-start; gap: 12px; padding: 14px 18px; cursor: pointer; }
.psec-head:hover .psec-name { color: var(--accent-ink); }
.picon {
  width: 32px; height: 32px; border-radius: 9px; flex: none;
  display: grid; place-items: center;
  background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c);
}
.psec-name { font-weight: 640; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.psec-name .ver { font-weight: 500; font-size: 11.5px; color: var(--muted); }
.psec-desc { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.psec-chev { color: var(--muted); transition: transform 0.15s; margin-top: 6px; }
.psec:not(.collapsed) .psec-chev { transform: rotate(90deg); }
.psec-body { padding: 2px 18px 18px; display: flex; flex-direction: column; gap: 14px; }
.psec.collapsed .psec-body { display: none; }
.params { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 12px; border-radius: 9px; background: var(--surface-2); }
.params .ico { color: var(--muted); }
.feat-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.feat {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px;
  font-family: var(--mono); font-size: 11.5px; color: var(--text);
  background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
}
.feat em { font-style: normal; font-family: var(--font); color: var(--text-2); }

/* tables */
.tbl-wrap { overflow: auto; max-height: 560px; }
table.grid-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 12.5px; }
.grid-table th {
  position: sticky; top: 0; z-index: 1;
  text-align: left; font-weight: 600; color: var(--text-2);
  background: var(--surface); padding: 8px 12px; border-bottom: 1px solid var(--border-strong); white-space: nowrap;
}
.grid-table th.sortable { cursor: pointer; user-select: none; }
.grid-table th.sortable:hover { color: var(--text); }
.grid-table th.sorted { color: var(--text); }
.grid-table td { padding: 7px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.grid-table tr:last-child td { border-bottom: 0; }
.grid-table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.grid-table tr.clickable { cursor: pointer; }
.grid-table tr.clickable:hover td { background: var(--surface-2); }
.grid-table .nm { font-weight: 560; color: var(--text); word-break: break-all; }
.grid-table .path { color: var(--muted); font-size: 12px; word-break: break-all; }
.type-badge { display: inline-block; padding: 1px 7px; border-radius: 5px; font-size: 11px; font-weight: 560; background: var(--surface-3); color: var(--text-2); }
.type-badge.number { background: color-mix(in srgb, var(--s1) 14%, transparent); color: var(--text); }
.type-badge.datetime { background: color-mix(in srgb, var(--s7) 16%, transparent); color: var(--text); }
.type-badge.derived { background: var(--accent-soft); color: var(--accent-ink); }
.spark { color: var(--accent); display: inline-flex; }
.top-vals { color: var(--text-2); font-size: 12px; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* virtual data table */
.vt-wrap { height: min(68vh, 640px); overflow: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); }
table.vt { border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.vt th {
  position: sticky; top: 0; z-index: 2;
  height: 34px; padding: 0 10px; text-align: left; font-weight: 600;
  background: var(--surface-2); border-bottom: 1px solid var(--border-strong);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.vt td { height: 28px; padding: 0 10px; border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vt .num { text-align: right; }
.vt .idx { position: sticky; left: 0; z-index: 1; background: var(--surface); color: var(--muted); text-align: right; border-right: 1px solid var(--border); }

.batch { border-top: 1px solid var(--border); }

details.errors summary { cursor: pointer; font-size: 12.5px; color: var(--critical); }

.welcome { max-width: 1080px; padding-top: 44px; }

.hero p { margin: 0; color: var(--text-2); font-size: 15px; max-width: 680px; }
.drop {

.tk-n { color: #b4570c; }
.tk-p { color: #1c5cab; }

:root[data-theme="dark"] .tk-n { color: #f0a96b; }

.modal-overlay { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: rgba(10, 10, 10, 0.42); backdrop-filter: blur(2px); }

/* toasts & drop overlay */

const DELIM_NAMES = { ',': '逗号', '\t': '制表符', ';': '分号', '|': '竖线' };

function highlight(code) {
  const re = /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|('(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*"|`(?:[^`\\]|\\.)*`)|\b(const|let|var|function|return|new|true|false|null|undefined|if|else|for|of|in|this)\b|\b(\d+(?:\.\d+)?)\b|([A-Za-z_$][\w$]*)(?=\s*:(?!:))/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'k' : m[4] ? 'n' : 'p';
    out += '<span class="tk-' + cls + '">' + esc(m[0]) + '</span>';
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

/* =====================================================================
 * CSV 解析核心 —— 这些函数会被序列化进 Web Worker，必须保持自包含
 * ===================================================================== */
function csvDecode(buf, partial) {
  const bytes = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  try {
    return { text: new TextDecoder('utf-8', { fatal: true }).decode(bytes, { stream: !!partial }), encoding: 'UTF-8' };
  } catch (e) {
    try { return { text: new TextDecoder('gb18030').decode(bytes, { stream: !!partial }), encoding: 'GB18030' }; }
    catch (e2) { return { text: new TextDecoder('utf-8').decode(bytes), encoding: 'UTF-8' }; }
  }
}

function csvDetectDelimiter(text) {
  const lines = [];
  let pos = 0;
  while (lines.length < 12 && pos < text.length) {
    let nl = text.indexOf('\n', pos);
    if (nl === -1) nl = text.length;
    const line = text.slice(pos, nl).replace(/\r$/, '');
    if (line.trim()) lines.push(line);
    pos = nl + 1;
  }
  if (!lines.length) return ',';
  let best = ',', bestScore = -1;
  for (const d of [',', '\t', ';', '|']) {
    const counts = lines.map((l) => {
      let c = 0, q = false;
      for (let i = 0; i < l.length; i++) {
        const ch = l[i];
        if (ch === '"') q = !q;
        else if (ch === d && !q) c++;
      }
      return c;
    });
    if (!counts[0]) continue;
    const same = counts.filter((c) => c === counts[0]).length / counts.length;
    const score = counts[0] * same * same;
    if (score > bestScore) { bestScore = score; best = d; }
  }
  return best;
}

/** 逐行解析，支持引号、转义引号、引号内换行、CRLF。返回停止时的字符位置。 */
function csvParseRows(text, delim, maxRows, onRow) {
  const D = delim.charCodeAt(0), Q = 34, CR = 13, LF = 10;
  const n = text.length;
  let i = text.charCodeAt(0) === 0xfeff ? 1 : 0;
  let row = [], rows = 0;
  while (i < n) {
    let c = text.charCodeAt(i), field;
    if (c === Q) {
      let j = i + 1, s = '';
      for (;;) {
        const k = text.indexOf('"', j);
        if (k === -1) { s += text.slice(j); i = n; break; }
        s += text.slice(j, k);
        if (text.charCodeAt(k + 1) === Q) { s += '"'; j = k + 2; }
        else { i = k + 1; break; }
      }
      while (i < n) {
        c = text.charCodeAt(i);
        if (c === D || c === LF || c === CR) break;
        s += text[i]; i++;
      }
      field = s;
    } else {
      let j = i;
      while (j < n) {
        c = text.charCodeAt(j);
        if (c === D || c === LF || c === CR) break;
        j++;
      }
      field = text.slice(i, j);
      i = j;
    }
    row.push(field);
    if (i >= n) { onRow(row); rows++; break; }
    c = text.charCodeAt(i);
    if (c === D) {
      i++;
      if (i >= n) { row.push(''); onRow(row); rows++; }
      continue;
    }
    if (c === CR && text.charCodeAt(i + 1) === LF) i += 2; else i++;
    onRow(row); rows++;
    row = [];
    if (maxRows && rows >= maxRows) return i;
  }
  return n;
}

function csvParseDate(s) {
  const m = /^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2})(?:[.,](\d{1,9}))?)?)?\s*(Z|[+-]\d{2}(?::?\d{2})?)?$/i.exec(s);
  if (m) {
    const mo = +m[2], d = +m[3], hh = +(m[4] || 0), mi = +(m[5] || 0), ss = +(m[6] || 0);
    if (mo < 1 || mo > 12 || d < 1 || d > 31 || hh > 23 || mi > 59 || ss > 60) return NaN;
    const ms = m[7] ? Math.round(Number('0.' + m[7]) * 1000) : 0;
    if (m[8]) {
      let off = 0;
      if (m[8].toUpperCase() !== 'Z') {
        const z = m[8].replace(':', '');
        off = (z[0] === '-' ? -1 : 1) * (+z.slice(1, 3) * 60 + (z.length >= 5 ? +z.slice(3, 5) : 0));
      }
      return Date.UTC(+m[1], mo - 1, d, hh, mi, ss, ms) - off * 60000;
    }
    return new Date(+m[1], mo - 1, d, hh, mi, ss, ms).getTime();
  }
  const t = /^(\d{1,2}):(\d{2})(?::(\d{2})(?:[.,](\d{1,9}))?)?$/.exec(s);
  if (t && +t[1] < 24 && +t[2] < 60) {
    return new Date(1970, 0, 1, +t[1], +t[2], +(t[3] || 0), t[4] ? Math.round(Number('0.' + t[4]) * 1000) : 0).getTime();
  }
  return NaN;
}

/** 推断列类型：number（≥95% 可解析为数字）、datetime、string、empty */
function csvInferColumn(name, raw) {
  const MISSING = { '': 1, na: 1, 'n/a': 1, nan: 1, null: 1, none: 1, nil: 1, '-': 1, '--': 1, '#n/a': 1, undefined: 1, '?': 1 };
  const n = raw.length;
  const num = new Float64Array(n);
  let nonMissing = 0, numeric = 0;
  for (let i = 0; i < n; i++) {
    const s = raw[i];
    if (s.length === 0) { num[i] = NaN; continue; }
    const v = +s;
    if (v === v) {
      if (v === 0 && !s.trim()) { num[i] = NaN; continue; }
      num[i] = v; numeric++; nonMissing++;
    } else {
      num[i] = NaN;
      if (!MISSING[s.trim().toLowerCase()]) nonMissing++;
    }
  }
  if (nonMissing === 0) return { name, type: 'empty', values: num, missing: n, invalid: 0 };
  if (numeric / nonMissing >= 0.95) return { name, type: 'number', values: num, missing: n - nonMissing, invalid: nonMissing - numeric };
  let tried = 0, ok = 0;
  for (let i = 0; i < n && tried < 200; i++) {
    const s = raw[i].trim();
    if (!s || MISSING[s.toLowerCase()]) continue;
    tried++;
    if (csvParseDate(s) === csvParseDate(s)) ok++;
  }
  if (tried && ok / tried >= 0.9) {
    let miss = 0, inv = 0;
    for (let i = 0; i < n; i++) {
      const s = raw[i].trim();
      if (!s || MISSING[s.toLowerCase()]) { num[i] = NaN; miss++; continue; }
      const t = csvParseDate(s);
      num[i] = t;
      if (t !== t) inv++;
    }
    return { name, type: 'datetime', values: num, raw, missing: miss, invalid: inv };
  }
  let miss = 0;
  for (let i = 0; i < n; i++) { const s = raw[i]; if (!s || MISSING[s.trim().toLowerCase()]) miss++; }
  return { name, type: 'string', values: raw, missing: miss, invalid: 0 };
}

function csvBuildTable(text, opts) {
  opts = opts || {};
  const delimiter = opts.delimiter || csvDetectDelimiter(text);
  let header = null, rows = 0;
  const cols = [];
  const pos = csvParseRows(text, delimiter, opts.maxRows || 0, function (row) {
    if (row.length === 1 && row[0].trim() === '') return;
    if (header === null) { header = row.slice(); for (let k = 0; k < row.length; k++) cols.push([]); return; }
    if (row.length > cols.length) {
      for (let k = cols.length; k < row.length; k++) { header.push(''); cols.push(new Array(rows).fill('')); }
    }
    for (let k = 0; k < cols.length; k++) cols[k].push(k < row.length ? row[k] : '');
    rows++;
  });
  const complete = pos >= text.length && !opts.dropLast;
  if (opts.dropLast && rows > 1) { for (const c of cols) c.pop(); rows--; }
  if (header === null) header = [];
  const headerless = header.length > 0 && header.every((s) => s.trim() !== '' && Number.isFinite(+s));
  if (headerless) {
    for (let k = 0; k < cols.length; k++) cols[k].unshift(header[k]);
    rows++;
    header = header.map(() => '');
  }
  const seen = {};
  const names = header.map((s, k) => {
    let nm = String(s).replace(/^﻿/, '').trim() || 'col' + (k + 1);
    if (seen[nm.toLowerCase()]) {
      let j = 2;
      while (seen[(nm + '_' + j).toLowerCase()]) j++;
      nm = nm + '_' + j;
    }
    seen[nm.toLowerCase()] = 1;
    return nm;
  });
  const columns = names.map((nm, k) => csvInferColumn(nm, cols[k]));
  return { delimiter, rowCount: rows, columns, headerless, consumed: pos, complete };
}

const WORKER_SRC = [csvDecode, csvDetectDelimiter, csvParseRows, csvParseDate, csvInferColumn, csvBuildTable].map(String).join('\n') + `
self.onmessage = async function (e) {
  const { id, file, opts } = e.data;
  try {
    const t0 = performance.now();
    const dec = csvDecode(await file.arrayBuffer(), false);
    const res = csvBuildTable(dec.text, opts);
    res.encoding = dec.encoding;
    res.parseMs = performance.now() - t0;
    const transfer = [];
    for (const c of res.columns) if (c.values instanceof Float64Array) transfer.push(c.values.buffer);
    self.postMessage({ id, ok: true, result: res }, transfer);
  } catch (err) {
    self.postMessage({ id, ok: false, error: String((err && err.message) || err) });
  }
};`;

/** 解析器：优先使用 2 个 Web Worker，失败时退回主线程 */
const Parser = {
  workers: [], next: 0, seq: 0, pending: new Map(), broken: false,
  init() {
    if (this.workers.length || this.broken) return;
    try {
      const url = URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }));
      for (let i = 0; i < 2; i++) {
        const w = new Worker(url);
        w.onmessage = (e) => this.done(e.data);
        w.onerror = (e) => { e.preventDefault(); this.fail(); };
        this.workers.push(w);
      }
    } catch (e) {
      this.broken = true;
    }
  },
  parse(file, opts) {
    this.init();
    if (this.broken) return this.parseMain(file, opts);
    const id = ++this.seq;
    const w = this.workers[this.next++ % this.workers.length];
    return new Promise((resolve, reject) => {
      this.pending.set(id, { resolve, reject, file, opts });
      w.postMessage({ id, file, opts });
    });
  },
  done(msg) {
    const p = this.pending.get(msg.id);
    if (!p) return;
    this.pending.delete(msg.id);
    if (msg.ok) p.resolve(msg.result); else p.reject(new Error(msg.error));
  },
  fail() {
    // Worker 无法运行（例如被浏览器策略阻止）：改为主线程解析
    this.broken = true;
    for (const w of this.workers) w.terminate();
    this.workers = [];
    const list = [...this.pending.values()];
    this.pending.clear();
    for (const p of list) this.parseMain(p.file, p.opts).then(p.resolve, p.reject);
  },
  async parseMain(file, opts) {
    const t0 = performance.now();
    const dec = csvDecode(await file.arrayBuffer(), false);
    const res = csvBuildTable(dec.text, opts);
    res.encoding = dec.encoding;
    res.parseMs = performance.now() - t0;
    return res;
  },
};

/* =====================================================================
 * 数据表：插件拿到的 t 就是它
 * ===================================================================== */
class DataTable {
  constructor(parsed, meta) {
    meta = meta || {};
    this.name = meta.name || '';
    this.path = meta.path || '';
    this.file = { name: this.name, path: this.path, size: meta.size || 0 };
    this.rowCount = parsed.rowCount;
    this.delimiter = parsed.delimiter;
    this.encoding = parsed.encoding;
    this.parseMs = parsed.parseMs;
    this._cols = [];
    this._exact = new Map();
    this._lower = new Map();
    this._stats = new Map();
    for (const c of parsed.columns) this._push(Object.assign({ derived: false, source: null }, c));
  }
  static fromRows(rows, meta) {
    const keys = [];
    const seen = new Set();
    for (const r of rows) for (const k in r) if (!k.startsWith('__') && !seen.has(k)) { seen.add(k); keys.push(k); }
    const columns = keys.map((k) => {
      const vals = rows.map((r) => r[k]);
      const numeric = vals.every((v) => v == null || typeof v === 'number' || typeof v === 'boolean');
      if (numeric) {
        const f = new Float64Array(vals.length);
        vals.forEach((v, i) => { f[i] = v == null ? NaN : +v; });
        return { name: k, type: 'number', values: f, missing: vals.filter((v) => v == null || Number.isNaN(+v)).length };
      }
      return { name: k, type: 'string', values: vals.map((v) => (v == null ? '' : String(v))), missing: vals.filter((v) => v == null || v === '').length };
    });
    return new DataTable({ rowCount: rows.length, columns }, meta);
  }
  _push(c) {
    this._cols.push(c);
    this._exact.set(c.name, c);
    const lk = c.name.trim().toLowerCase();
    if (!this._lower.has(lk)) this._lower.set(lk, c);
  }
  _reindex() {
    this._exact = new Map();
    this._lower = new Map();
    const cols = this._cols;
    this._cols = [];
    for (const c of cols) this._push(c);
  }
  get columns() { return this._cols.map((c) => c.name); }
  get numericColumns() { return this._cols.filter((c) => c.type === 'number').map((c) => c.name); }
  getColumn(name) {
    if (name == null) return null;
    if (Array.isArray(name)) {
      for (const n of name) { const c = this.getColumn(n); if (c) return c; }
      return null;
    }
    return this._exact.get(name) || this._lower.get(String(name).trim().toLowerCase()) || null;
  }
  col(name) { const c = this.getColumn(name); return c ? c.values : undefined; }
  find(name) { const c = this.getColumn(name); return c ? c.name : null; }
  has(...names) { return names.every((n) => !!this.getColumn(n)); }
  type(name) { const c = this.getColumn(name); return c ? c.type : null; }
  isNumeric(name) { return this.type(name) === 'number'; }
  addColumn(name, values, meta) {
    meta = meta || {};
    name = String(name);
    if (!values || values.length !== this.rowCount) {
      throw new Error('特征 "' + name + '" 的长度为 ' + (values ? values.length : 0) + '，应与行数 ' + this.rowCount + ' 相同');
    }
    let type = meta.type;
    if (!type) {
      if (ArrayBuffer.isView(values)) type = 'number';
      else {
        type = 'number';
        for (let i = 0; i < values.length; i++) {
          const v = values[i];
          if (v != null && typeof v !== 'number' && typeof v !== 'boolean') { type = 'string'; break; }
        }
      }
    }
    let vals;
    if (type === 'number' || type === 'datetime') {
      vals = values instanceof Float64Array ? values : Float64Array.from(values, (v) => (v == null ? NaN : +v));
    } else vals = Array.from(values, (v) => (v == null ? '' : String(v)));
    const existing = this.getColumn(name);
    if (existing && !existing.derived) throw new Error('特征名 "' + name + '" 与原始列 "' + existing.name + '" 冲突');
    if (existing) { this._cols.splice(this._cols.indexOf(existing), 1); this._reindex(); }
    let missing = 0;
    for (let i = 0; i < vals.length; i++) { const v = vals[i]; if (v === '' || (typeof v === 'number' && !Number.isFinite(v))) missing++; }
    const col = { name, type, values: vals, derived: true, source: meta.source || null, label: meta.label || '', unit: meta.unit || '', description: meta.description || '', missing, invalid: 0 };
    this._push(col);
    this._stats.delete(name);
    return col;
  }
  removeDerived(source) {
    const keep = this._cols.filter((c) => !c.derived || (source !== undefined && c.source !== source));
    if (keep.length === this._cols.length) return;
    for (const c of this._cols) if (!keep.includes(c)) this._stats.delete(c.name);
    this._cols = keep;
    this._reindex();
  }
  map(names, fn) {
    names = Array.isArray(names) ? names : [names];
    const cols = names.map((nm) => {
      const v = this.col(nm);
      if (!v) throw new Error('列不存在: ' + nm);
      return v;
    });
    const n = this.rowCount, k = cols.length, out = new Float64Array(n), args = new Array(k + 1);
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < k; j++) args[j] = cols[j][i];
      args[k] = i;
      const v = fn.apply(null, args);
      out[i] = v == null ? NaN : v;
    }
    return out;
  }
  row(i) {
    const o = {};
    for (const c of this._cols) o[c.name] = c.values[i];
    return o;
  }
  stats(name) {
    const c = this.getColumn(name);
    if (!c) return null;
    if (this._stats.has(c.name)) return this._stats.get(c.name);
    let s;
    const v = c.values;
    if (c.type === 'string' || c.type === 'empty' && !(v instanceof Float64Array)) {
      const m = new Map();
      let miss = 0;
      for (let i = 0; i < v.length; i++) {
        const x = v[i];
        if (x === '' || x == null) { miss++; continue; }
        if (m.size < 50000 || m.has(x)) m.set(x, (m.get(x) || 0) + 1);
      }
      const top = [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5);
      s = { kind: 'string', count: v.length - miss, missing: miss, distinct: m.size, capped: m.size >= 50000, top };
    } else {
      let n = 0, mean = 0, m2 = 0, mn = Infinity, mx = -Infinity;
      for (let i = 0; i < v.length; i++) {
        const x = v[i];
        if (!Number.isFinite(x)) continue;
        n++;
        const d = x - mean;
        mean += d / n;
        m2 += d * (x - mean);
        if (x < mn) mn = x;
        if (x > mx) mx = x;
      }
      const bins = 24, hist = new Array(bins).fill(0);
      if (n && mx > mn) {
        const w = (mx - mn) / bins;
        for (let i = 0; i < v.length; i++) { const x = v[i]; if (Number.isFinite(x)) hist[Math.min(bins - 1, Math.floor((x - mn) / w))]++; }
      } else if (n) hist[Math.floor(bins / 2)] = n;
      s = { kind: c.type, count: n, missing: v.length - n, min: n ? mn : NaN, max: n ? mx : NaN, mean: n ? mean : NaN, std: n > 1 ? Math.sqrt(m2 / (n - 1)) : NaN, hist };
    }
    this._stats.set(c.name, s);
    return s;
  }
  /** 单元格文本。display=true 时去掉衍生特征的浮点噪声（导出时保留完整精度） */
  cellText(c, i, display) {
    const v = c.values[i];
    if (c.type === 'string') return v;
    if (c.type === 'datetime') return c.raw ? c.raw[i] : (Number.isFinite(v) ? fmtDate(v) : '');
    if (!Number.isFinite(v)) return '';
    if (display && c.derived && !Number.isInteger(v)) return String(Math.abs(v) >= 1e5 ? +v.toFixed(3) : +v.toPrecision(6));
    return String(v);
  }
  toCSV() {
    const q = (s) => (/[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s);
    const cols = this._cols;
    const lines = [cols.map((c) => q(c.name)).join(',')];
    for (let i = 0; i < this.rowCount; i++) lines.push(cols.map((c) => q(this.cellText(c, i))).join(','));
    return lines.join('\r\n');
  }
}

/* =====================================================================
 * 工具函数（插件中通过 ctx.utils / CSVViewer.utils 使用）
 * ===================================================================== */
const EPOCH_RANGES = [
  [1e-6, 9.46e17, 4.2e18], // 纳秒
  [1e-3, 9.46e14, 4.2e15], // 微秒
  [1, 9.46e11, 4.2e12],    // 毫秒
  [1000, 9.46e8, 4.2e9],   // 秒
];
/** 若数值看起来是 2000–2100 年间的 Unix 时间戳，返回换算到毫秒的倍数，否则 null */
function epochScale(values) {
  if (!values || !values.length) return null;
  let lo = Infinity, hi = -Infinity, n = 0;
  const step = Math.max(1, Math.floor(values.length / 4000));
  for (let i = 0; i < values.length; i += step) {
    const v = values[i];
    if (typeof v === 'number' && Number.isFinite(v)) { if (v < lo) lo = v; if (v > hi) hi = v; n++; }
  }
  const last = values[values.length - 1];
  if (typeof last === 'number' && Number.isFinite(last)) { if (last < lo) lo = last; if (last > hi) hi = last; }
  if (!n) return null;
  for (const [scale, a, b] of EPOCH_RANGES) if (lo >= a && hi <= b) return scale;
  return null;
}
function isNum(v) { return typeof v === 'number' && Number.isFinite(v); }

const U = {
  fmt: fmtNum, fmtBytes, fmtDuration, fmtDate,
  isNum,
  finite(a) { const o = []; for (let i = 0; i < a.length; i++) if (isNum(a[i])) o.push(a[i]); return o; },
  count(a) { let n = 0; if (a) for (let i = 0; i < a.length; i++) if (isNum(a[i])) n++; return n; },
  sum(a) { let s = 0; if (a) for (let i = 0; i < a.length; i++) if (isNum(a[i])) s += a[i]; return s; },
  mean(a) { let s = 0, n = 0; if (a) for (let i = 0; i < a.length; i++) if (isNum(a[i])) { s += a[i]; n++; } return n ? s / n : NaN; },
  variance(a) {
    let n = 0, m = 0, m2 = 0;
    if (a) for (let i = 0; i < a.length; i++) { const x = a[i]; if (!isNum(x)) continue; n++; const d = x - m; m += d / n; m2 += d * (x - m); }
    return n > 1 ? m2 / (n - 1) : NaN;
  },

  const xAxis = Object.assign(xAxisStyle(T), {
    type: ax.type,
    name: xName || '',

    boundaryGap: ax.type === 'category',

  if (ax.type === 'value' || ax.type === 'time') { xAxis.min = 'dataMin'; xAxis.max = 'dataMax'; }
  if (ax.type === 'value') xAxis.axisLabel.formatter = fmtAxis;
  if (ax.type === 'category') Object.assign(xAxis.axisLabel, { width: horizontal ? 150 : 90, overflow: 'truncate' });
  const yAxis = Object.assign(yAxisStyle(T), { type: 'value', scale: !spec.yZero && !allBar, name: '' });
  if (spec.yMin != null) yAxis.min = spec.yMin;
  if (spec.yMax != null) yAxis.max = spec.yMax;
  if (allBar && spec.labels) {
    // 给条形末端的数值标签留出空间（ECharts 按数据跨度计算留白，这里换算成以 0 为基线的跨度）
    let lo = Infinity, hi = -Infinity;
    for (const s of series) for (const d of s.data) { const v = (d.value || d)[horizontal ? 0 : 1]; if (v < lo) lo = v; if (v > hi) hi = v; }
    if (Number.isFinite(lo)) {
      const span = Math.max(hi, 0) - Math.min(lo, 0) || 1;
      const dataSpan = hi - lo || Math.abs(hi) || 1;

      s += '<div style="color:' + T.text2 + '">' + esc(p.seriesName) + '</div>';

function buildSeries(r, ax, T, i, total, spec, horizontal) {
  const color = r.def.color || T.series[(r.def.colorIndex != null ? r.def.colorIndex : i) % T.series.length];
  const ys = r.yv.values, xs = r.xv ? r.xv.values : null, n = ys.length;
  const cat = ax.type === 'category', sc = ax.scale;
  const data = [];
  let sorted = true, last = -Infinity;
  for (let k = 0; k < n; k++) {
    const y = ys[k];
    if (typeof y !== 'number' || !Number.isFinite(y)) continue;
    let x = k;
    if (xs) {
      x = xs[k];
      if (cat) { if (x == null || x === '') continue; x = String(x); }
      else {
        if (typeof x !== 'number' || !Number.isFinite(x)) continue;
        x *= sc;
        if (x < last) sorted = false;
        last = x;
      }
    }
    data.push(horizontal ? [y, x] : [x, y]);
  }
  const t = r.type;
  if (!sorted && LINEISH.has(t)) data.sort((a, b) => a[0] - b[0]);
  const base = { name: r.name, data, emphasis: { focus: total > 1 ? 'series' : 'none' } };
  if (t === 'scatter') {
    const big = data.length > 5000, mid = data.length > 1200;
    return Object.assign(base, {
      type: 'scatter',
      symbolSize: big ? 4 : mid ? 6 : 8,
      large: big, largeThreshold: 5000,
      itemStyle: { color, opacity: big ? 0.5 : mid ? 0.7 : 0.9, borderColor: T.surface, borderWidth: mid ? 0 : 2 },
      emphasis: { scale: 1.5, focus: total > 1 ? 'series' : 'none' },
    });
  }
  if (t === 'bar') {
    // 负值条形：圆角与数值标签放到数据端
    const negEnd = { borderRadius: horizontal ? [4, 0, 0, 4] : [0, 0, 4, 4] };
    const negLabel = spec.labels ? { position: horizontal ? 'left' : 'bottom' } : undefined;
    base.data = data.map((d) => ((horizontal ? d[0] : d[1]) < 0 ? { value: d, itemStyle: negEnd, label: negLabel } : d));
    return Object.assign(base, {
      type: 'bar',
      barMaxWidth: 24,
      itemStyle: { color, borderRadius: horizontal ? [0, 4, 4, 0] : [4, 4, 0, 0] },
      large: data.length > 3000,
      label: spec.labels ? {
        show: true, position: horizontal ? 'right' : 'top', color: T.text2, fontSize: 11,
        formatter: (p) => fmtNum(horizontal ? p.value[0] : p.value[1]),
      } : undefined,
    });
  }
  return Object.assign(base, {
    type: 'line',
    showSymbol: data.length <= 40,
    symbol: 'circle',
    symbolSize: 8,
    sampling: 'lttb',
    step: t === 'step' ? 'end' : false,
    lineStyle: { width: 2, color, cap: 'round', join: 'round' },
    itemStyle: { color, borderColor: T.surface, borderWidth: 2 },
    areaStyle: t === 'area' ? { color, opacity: 0.1 } : undefined,
    connectNulls: false,
    emphasis: { focus: total > 1 ? 'series' : 'none', lineStyle: { width: 2 } },
  });
}

function histogramOption(spec, table, T) {
  const ys = yList(spec.y).map((y) => resolveVec(y, table)).filter(Boolean);
  if (!ys.length) throw new Error('直方图缺少 y');
  const bins = Math.max(2, Math.min(200, Math.round(spec.bins || 30)));
  let lo = Infinity, hi = -Infinity;
  for (const yv of ys) for (let i = 0; i < yv.values.length; i++) { const v = yv.values[i]; if (isNum(v)) { if (v < lo) lo = v; if (v > hi) hi = v; } }
  if (spec.range) [lo, hi] = spec.range;
  if (!Number.isFinite(lo)) throw new Error('没有可用的数值');
  if (hi === lo) { lo -= 0.5; hi += 0.5; }
  const w = (hi - lo) / bins;
  const labels = Array.from({ length: bins }, (_, k) => fmtAxis(lo + w * (k + 0.5)));
  const series = ys.map((yv, i) => {
    const counts = new Array(bins).fill(0);
    for (let k = 0; k < yv.values.length; k++) {
      const v = yv.values[k];
      if (isNum(v) && v >= lo && v <= hi) counts[Math.min(bins - 1, Math.floor((v - lo) / w))]++;
    }
    return {
      type: 'bar', name: yv.name || '系列 ' + (i + 1), data: counts,
      barCategoryGap: ys.length > 1 ? '20%' : 2,
      itemStyle: { color: T.series[i % 8], borderRadius: [3, 3, 0, 0] },
      emphasis: { itemStyle: { opacity: 0.8 } },
    };
  });
  const xName = spec.xLabel !== undefined ? spec.xLabel : ys.length === 1 ? ys[0].name : '';
  const opt = baseOption(T, { legend: ys.length > 1, trigger: 'item', legendIcon: 'roundRect', xName: !!xName, name: spec.title });
  opt.xAxis = Object.assign(xAxisStyle(T), { type: 'category', data: labels, name: xName, nameLocation: 'middle', nameGap: 24 });
  opt.yAxis = Object.assign(yAxisStyle(T), { type: 'value', minInterval: 1 });
  opt.tooltip.formatter = (p) =>
    '<div style="font-weight:600;font-size:13px">' + p.value + ' 条</div>' +
    '<div style="color:' + T.muted + '">' + esc(fmtNum(lo + w * p.dataIndex)) + ' – ' + esc(fmtNum(lo + w * (p.dataIndex + 1))) + '</div>' +
    (ys.length > 1 ? '<div style="color:' + T.text2 + '">' + esc(p.seriesName) + '</div>' : '');
  opt.series = series;
  return opt;
}

function heatmapOption(spec, table, T) {
  const xc = (spec.xCategories || []).map(String), yc = (spec.yCategories || []).map(String);

    return { value: [i, j, ok ? v : '-'], label: { color: strong ? '#ffffff' : T.text } };

  opt.yAxis = { type: 'category', data: yc, inverse: true, axisLine: { show: false }, axisTick: { show: false }, splitArea: { show: false }, axisLabel: { color: T.muted, fontSize: 11, interval: 0, width: 120, overflow: 'truncate' } };

    min, max, calculable: false, orient: 'horizontal', left: 'center', bottom: 0,

    inRange: { color: diverging ? [T.divNeg, T.divMid, T.divPos] : T.seq },

    type: 'heatmap', data,

    itemStyle: { borderColor: T.surface, borderWidth: 2, borderRadius: 4 },
    emphasis: { itemStyle: { borderColor: T.text, borderWidth: 1.5 } },
  }];
  opt.tooltip.formatter = (p) =>
    '<div style="font-weight:600;font-size:13px">' + (typeof p.value[2] === 'number' ? esc(fmtNum(p.value[2])) : '—') + '</div>' +
    '<div style="color:' + T.muted + '">' + esc(xc[p.value[0]]) + ' × ' + esc(yc[p.value[1]]) + '</div>';
  return opt;

/* 图表生命周期：进入视口才初始化，离开页面时统一销毁 */
const Charts = {
  instances: new Set(),
  io: null,
  ro: null,
  init() {
    this.io = new IntersectionObserver((entries) => {
      for (const en of entries) {
        if (!en.isIntersecting) continue;
        this.io.unobserve(en.target);
        if (en.target.__mount) en.target.__mount();
      }
    }, { rootMargin: '300px 0px' });
    this.ro = new ResizeObserver((entries) => {
      for (const en of entries) {
        const inst = en.target.__chart;
        if (inst && !inst.isDisposed()) inst.resize();
      }
    });
  },
  disposeIn(el) {
    if (!el) this.io.disconnect();
    for (const inst of [...this.instances]) {
      const dom = inst.getDom();
      if (!el || el.contains(dom)) {
        this.ro.unobserve(dom);
        try { inst.dispose(); } catch (e) { /* already gone */ }
        this.instances.delete(inst);
      }
    }
  },
};

function mountChart(host, getOption, group) {

    host.__mount = null;

    let option;
    try { option = getOption(); }
    catch (err) { host.append(h('div', { class: 'chart-msg bad' }, '图表出错：' + ((err && err.message) || err))); return; }
    const inst = echarts.init(host, null, { renderer: 'canvas' });
    try { inst.setOption(option); }
    catch (err) { inst.dispose(); host.append(h('div', { class: 'chart-msg bad' }, '图表出错：' + ((err && err.message) || err))); return; }
    if (group) { inst.group = group; echarts.connect(group); }
    host.__chart = inst;
    Charts.instances.add(inst);

const TableCache = {
  map: new Map(),
  maxEntries: 8,
  maxBytes: 400 * 1024 * 1024,
  get(id) {
    const t = this.map.get(id);
    if (t) { this.map.delete(id); this.map.set(id, t); }
    return t;
  },
  set(id, t) {
    this.map.set(id, t);
    let total = 0;
    for (const x of this.map.values()) total += x.file.size;
    while ((this.map.size > this.maxEntries || total > this.maxBytes) && this.map.size > 1) {
      const [k, x] = this.map.entries().next().value;
      this.map.delete(k);
      total -= x.file.size;
    }
  },
  clear() { this.map.clear(); },
};
const inflight = new Map();
function getTable(e) {
  const hit = TableCache.get(e.id);
  if (hit) return Promise.resolve(hit);
  if (inflight.has(e.id)) return inflight.get(e.id);
  const pr = Parser.parse(e.file, { delimiter: e.delimiter || null })
    .then((res) => {
      const t = new DataTable(res, e);
      TableCache.set(e.id, t);
      e.rows = t.rowCount;
      e.rowsExact = true;
      return t;
    })
    .finally(() => inflight.delete(e.id));
  inflight.set(e.id, pr);
  return pr;
}

/** 表头信息：插件 match() 拿到的 info */
function entryInfo(e) {
  if (e._info) return e._info;
  const cols = e.columns || [], types = e.types || [];
  const lower = new Map();
  cols.forEach((c) => { const k = c.trim().toLowerCase(); if (!lower.has(k)) lower.set(k, c); });
  const typeOf = new Map(cols.map((c, i) => [c, types[i]]));
  const find = (n) => {
    if (Array.isArray(n)) { for (const x of n) { const c = find(x); if (c) return c; } return null; }
    if (n == null) return null;
    return typeOf.has(n) ? n : lower.get(String(n).trim().toLowerCase()) || null;
  };
  e._info = {
    name: e.name, path: e.path, dir: e.dir, size: e.size,
    columns: cols.slice(),
    numericColumns: cols.filter((c, i) => types[i] === 'number'),
    find,
    has: (...names) => names.every((n) => !!find(n)),
    type: (n) => { const c = find(n); return c ? typeOf.get(c) : null; },
    isNumeric: (n) => { const c = find(n); return !!c && typeOf.get(c) === 'number'; },
  };
  return e._info;
}
function computeMatches() {
  const plugins = Plugins.sorted();
  for (const e of state.entries) {
    if (!e.columns) { e.matches = []; e.matchAll = []; continue; }
    const info = entryInfo(e);
    e.matchAll = plugins.filter((p) => {
      try { return !!p._match(info); }
      catch (err) { console.warn('[CSV Lens] 插件 ' + p.id + ' 的 match() 出错：', err); return false; }
    }).map((p) => p.id);
    const active = e.matchAll.filter((id) => Plugins.isEnabled(id)).map((id) => Plugins.byId.get(id));
    const primary = active.filter((p) => !p.fallback);
    e.matches = (primary.length ? primary : active).map((p) => p.id);
  }
}
function pluginsFor(e) { return (e.matches || []).map((id) => Plugins.byId.get(id)).filter(Boolean); }

/* =====================================================================
 * 读取目录
 * ===================================================================== */
async function walkHandle(dir, prefix, out) {
  for await (const [name, handle] of dir.entries()) {
    if (handle.kind === 'directory') {
      if (SKIP_DIRS.has(name)) continue;
      await walkHandle(handle, prefix + name + '/', out);
    } else if (DATA_EXT.test(name) || PLUGIN_EXT.test(name)) {
      out.push({ path: prefix + name, file: await handle.getFile() });
    }
  }
}
async function walkEntry(entry, prefix, out) {
  if (entry.isFile) {
    if (DATA_EXT.test(entry.name) || PLUGIN_EXT.test(entry.name)) {
      out.push({ path: prefix + entry.name, file: await new Promise((res, rej) => entry.file(res, rej)) });
    }
  } else if (entry.isDirectory) {
    if (SKIP_DIRS.has(entry.name)) return;
    const reader = entry.createReader();
    for (;;) {
      const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      if (!batch.length) break;
      for (const child of batch) await walkEntry(child, prefix + entry.name + '/', out);
    }
  }
}
async function openFolder() {
  if (window.showDirectoryPicker) {
    try {
      const handle = await window.showDirectoryPicker({ id: 'csvlens', mode: 'read' });
      await loadFromHandle(handle);
      return;
    } catch (err) {
      if (err && err.name === 'AbortError') return;
      console.warn('[CSV Lens] showDirectoryPicker 不可用，改用文件选择框', err);
    }
  }
  $('#dirInput').click();
}
async function loadFromHandle(handle) {
  const busy = toast('正在遍历目录「' + handle.name + '」…', 'info', { sticky: true, spinner: true });
  const items = [];
  try { await walkHandle(handle, '', items); }
  catch (err) { busy.close(); toast('读取目录失败：' + err.message, 'error'); return; }
  busy.close();
  await loadCollection(items, handle.name, handle);
}
function rescan() {
  if (state.dirHandle) loadFromHandle(state.dirHandle);
  else openFolder();
}
async function handleDrop(dt) {

  }

    for (const en of entries) {

    }
  } else {
    for (const f of Array.from(dt.files || [])) {

  if (scripts.length) await importPluginFiles(scripts);
  if (!items.length) {
    if (!scripts.length) toast('没有找到 CSV 文件', 'error');
    return;
  }
  const dirs = entries.filter((en) => en.isDirectory);
  let root = '拖入的文件';

        for (let k = 0; k < c.values.length; k++) if (isNum(c.values[k])) { x0 = c.values[k]; break; }
        const f = sc ? sc / 1000 : 1;
        xv = { name: '', values: Float64Array.from(c.values, (v) => (v - x0) * f), type: 'number' };
        xLabel = sc ? '距起点（秒）' : cfg.x + ' − 起点';
        xType = 'value';
      }
      return { name: e.path, x: xv, y: { name: cfg.y, values: t.col(cfg.y), type: 'number' }, color: T.series[state.selColor.get(e.id) % 8] };
    });
    out.append(h('div', { class: 'chart-grid' }, chartCard({ title: cfg.y + ' vs ' + xLabel, type: cfg.type, series, xType, xLabel, span: 2, height: 380 }, null, null)));
    const rows = es.map((e, i) => {
      const v = tables[i].col(cfg.y);
      return { e, n: U.count(v), mean: U.mean(v), std: U.std(v), min: U.min(v), median: U.median(v), max: U.max(v) };
    });
    out.append(h('div', { class: 'card' },
      h('div', { class: 'card-head' }, icon('table', 16), h('div', { class: 'card-title' }, cfg.y + ' 统计')),
      h('div', { class: 'card-body flush' }, sortableTable([
        { key: 'file', label: '文件', value: (r) => r.e.path, render: (r) => h('span', { style: { display: 'inline-flex', gap: '8px', alignItems: 'center' } }, h('span', { class: 'dot', style: { '--c': 'var(--s' + (state.selColor.get(r.e.id) + 1) + ')' } }), h('span', { class: 'nm' }, r.e.path)) },
        { key: 'n', label: '有效值', num: true }, { key: 'mean', label: '均值', num: true }, { key: 'std', label: '标准差', num: true },
        { key: 'min', label: '最小', num: true }, { key: 'median', label: '中位数', num: true }, { key: 'max', label: '最大', num: true },
      ], rows, { onRowClick: (r) => openFile(r.e.id) }))));
  };
  draw();
}

/* =====================================================================
 * 插件管理 / 编辑器
 * ===================================================================== */
function pluginTemplate(table) {
  const cols = table ? table._cols.filter((c) => !c.derived) : [];
  const tc = table ? U.timeColumn(table) : 'ts';
  const nums = cols.filter((c) => c.type === 'number' && c.name !== tc).map((c) => c.name).slice(0, 3);
  const ys = nums.length ? nums : ['value'];
  const x = tc || null;
  const need = [x, ...ys].filter(Boolean);
  const J = (v) => JSON.stringify(v);
  const fileHint = table && table.path ? ' * 根据 ' + table.path.replace(/\*\//g, '* /') + ' 的列名生成\n' : '';
  return `/**
 * 我的插件
${fileHint} * 完整 API 见「插件」面板的「编写插件」页，或 plugins/_template.js
 */
CSVViewer.registerPlugin({
  id: 'my-plugin-${Date.now().toString(36)}',
  name: '我的插件',
  version: '0.1.0',
  description: '这里写一句话说明插件做什么。',

  // 含这些列（不区分大小写）的 CSV 会套用此插件
  match: { columns: ${J(need)} },

  // 可调参数：显示在插件卡片上，通过 ctx.params 读取
  params: [
    { key: 'window', label: '平滑窗口', type: 'number', default: 10, min: 1, step: 1 },
  ],

  // 衍生特征：返回与行数等长的数组，作为新列加入表格
  features: [
    {
      name: ${J(ys[0] + '_ma')},
      label: '滑动平均',
      compute: (t, { utils, params }) => utils.movingAverage(t.col(${J(ys[0])}), params.window),
    },
  ],

  // 指标卡片
  metrics: (t, { utils: u }) => [
    { label: '行数', value: t.rowCount },
    { label: ${J(ys[0] + ' 均值')}, value: u.mean(t.col(${J(ys[0])})) },
  ],

  // 子图：每个对象一张图；x 相同的图会联动
  charts: () => [
${ys.map((y) => '    { title: ' + J(y + ' vs ' + (x || '行号')) + ", type: 'line', " + (x ? 'x: ' + J(x) + ', ' : '') + 'y: ' + (y === ys[0] ? J([y, y + '_ma']) : J(y)) + ' },').join('\n')}
  ],

  // 批量分析（可选）：每个文件汇总成一行
  summarize: (t, { utils: u }) => ({
    rows: t.rowCount,
    ${J(ys[0] + '_mean')}: u.mean(t.col(${J(ys[0])})),
  }),
});
`;
}
const API_DOC_ROWS = [
  ['id / name / version / description', '基本信息；id 唯一，同 id 重新注册会覆盖（热更新）'],
  ['match', '匹配规则：{ columns, anyColumns, numericColumns, path, test } 或函数 (info) => boolean。列名不区分大小写，columns 里的数组表示别名'],
  ['priority / fallback', '排序优先级；fallback: true 为兜底插件，只在没有其他插件匹配时启用'],
  ['params', '可调参数 [{ key, label, type: number | select | checkbox | text, default, options }]，在 ctx.params 中读取'],
  ['features', '衍生特征 [{ name, label, description, compute(t, ctx) → 等长数组 }]，新列可用于绘图、导出'],
  ['metrics(t, ctx)', '返回指标卡片 [{ label, value, unit, digits, hint }]'],
  ['charts(t, ctx)', '返回子图 [{ title, type, x, y, ... }]，type: line | area | step | scatter | bar | histogram | heatmap'],
  ['render(el, t, ctx)', '完全自定义的 DOM 渲染；ctx.renderChart(el, spec) 可在其中画图'],
  ['summarize(t, ctx)', '批量分析：每个文件返回一行对象，在目录概览页运行'],
  ['aggregate(s, ctx)', '跨文件汇总：s 为所有 summarize 结果组成的表，返回 { metrics, charts }'],
];
function openPluginManager(initialTab) {
  let tab = initialTab === 'docs' ? 'docs' : 'list';
  const body = h('div');
  const draw = () => {
    body.textContent = '';
    body.append(h('div', { class: 'tabs' },
      h('button', { class: 'tab' + (tab === 'list' ? ' on' : ''), onclick: () => { tab = 'list'; draw(); } }, icon('plug', 15), '已加载插件', h('span', { class: 'badge' }, Plugins.list.length)),
      h('button', { class: 'tab' + (tab === 'docs' ? ' on' : ''), onclick: () => { tab = 'docs'; draw(); } }, icon('code', 15), '编写插件')));
    if (tab === 'list') drawList(); else drawDocs();
  };
  const drawList = () => {
    body.append(h('div', { class: 'pm-actions' },
      h('button', { class: 'btn', onclick: () => $('#pluginInput').click() }, icon('upload', 15), '导入 .js'),
      h('button', { class: 'btn ghost', onclick: () => openPluginEditor(null, pluginTemplate(null)) }, icon('plus', 15), '新建插件'),
      state.folderPlugins.length ? h('button', { class: 'btn ghost', onclick: loadFolderPlugins }, icon('folder', 15), '加载数据目录中的 ' + state.folderPlugins.length + ' 个插件') : null,
      h('span', { class: 'muted small' }, '也可以把 .js 文件直接拖进窗口')));
    if (!Plugins.list.length) body.append(emptyState('plug', '还没有插件', '在 plugins/index.js 中登记插件文件，或在这里导入 / 新建。'));
    const records = userPluginRecords();
    for (const p of Plugins.sorted()) {
      const n = state.entries.filter((e) => (e.matches || []).includes(p.id)).length;
      const nAll = state.entries.filter((e) => (e.matchAll || []).includes(p.id)).length;
      const rec = p._origin === 'user' ? records.find((r) => r.key === p._key) : null;
      const origin = { file: '文件', user: '本地', folder: '数据目录', runtime: '运行时' }[p._origin] || p._origin;
      const hooks = [
        p.features.length ? p.features.length + ' 个特征' : null,
        typeof p.metrics === 'function' ? '指标' : null,
        typeof p.charts === 'function' ? '子图' : null,
        typeof p.render === 'function' ? '自定义渲染' : null,
        typeof p.summarize === 'function' ? '批量' : null,
        typeof p.aggregate === 'function' ? '跨文件汇总' : null,
      ].filter(Boolean).join(' · ');
      body.append(h('div', { class: 'pm-row' },
        h('span', { class: 'picon', style: { '--c': pluginColor(p) } }, icon('plug', 16)),
        h('div', { class: 'grow' },
          h('div', { class: 'pm-name' }, p.name, p.version ? h('span', { class: 'muted small' }, 'v' + p.version) : null, h('span', { class: 'tag' }, origin), p.fallback ? h('span', { class: 'tag' }, '兜底') : null, h('span', { class: 'muted small mono' }, p.id)),
          p.description ? h('div', { class: 'pm-desc' }, p.description) : null,
          h('div', { class: 'pm-meta' }, matchSummary(p), state.entries.length ? ' · 当前目录匹配 ' + n + ' 个文件' + (nAll !== n ? '（' + nAll + ' 个符合条件）' : '') : '', hooks ? ' · ' + hooks : ''),
          p._src ? h('div', { class: 'pm-meta mono' }, p._src.replace(/^.*\/plugins\//, 'plugins/')) : null),
        h('div', { class: 'pm-ctrl' },
          rec ? h('button', { class: 'icon-btn sm', title: '编辑', 'aria-label': '编辑', onclick: () => openPluginEditor(rec) }, icon('edit', 15)) : null,
          rec ? h('button', { class: 'icon-btn sm', title: '删除', 'aria-label': '删除', onclick: () => { if (confirm('删除本地插件「' + p.name + '」？')) { deleteUserPlugin(rec.key); toast('已删除', 'success'); } } }, icon('trash', 15)) : null,
          h('label', { class: 'switch', title: Plugins.isEnabled(p.id) ? '已启用' : '已停用' },
            h('input', { type: 'checkbox', checked: Plugins.isEnabled(p.id), 'aria-label': '启用 ' + p.name, onchange: (ev) => Plugins.setEnabled(p.id, ev.target.checked) }), h('i')))));
    }
  };
  const drawDocs = () => {
    body.append(
      h('p', { class: 'muted', style: { marginTop: 0 } }, '一个插件就是一次 ', h('code', null, 'CSVViewer.registerPlugin({...})'), ' 调用。除 id 外所有字段都可选。放进 plugins/ 并登记到 plugins/index.js 即随页面加载；也可以在这里新建（保存在浏览器本地），或在数据目录中放 *.plugin.js。'),
      h('table', { class: 'doc-table' }, h('thead', null, h('tr', null, h('th', null, '字段'), h('th', null, '说明'))),
        h('tbody', null, API_DOC_ROWS.map(([k, v]) => h('tr', null, h('td', null, h('code', null, k)), h('td', null, v))))),
      h('p', { class: 'muted' }, '钩子参数 ', h('code', null, 't'), ' 是数据表：', h('code', null, 't.col(name)'), ' 取列（数值列为 Float64Array，缺失为 NaN）、', h('code', null, 't.map([a, b], fn)'), ' 逐行计算、', h('code', null, 't.stats(name)'), '、', h('code', null, 't.find([别名…])'), '；', h('code', null, 'ctx.utils'), ' 提供 mean / std / rms / median / diff / movingAverage / ema / corr / linreg / duration / timeColumn 等。'),
      h('div', { style: { display: 'flex', gap: '8px', alignItems: 'center', margin: '4px 0 10px' } },
        h('b', null, '示例模板'), h('div', { class: 'grow' }),
        h('button', { class: 'btn sm', onclick: () => openPluginEditor(null, pluginTemplate(null)) }, icon('plus', 14), '以此模板新建')),
      h('pre', { class: 'code boxed', html: highlight(pluginTemplate(null)) }));
  };
  pluginListeners.add(draw);
  draw();
  openModal({ title: '插件', body, wide: true, onClose: () => pluginListeners.delete(draw) });
}
function openPluginEditor(rec, initial) {
  const source = rec ? rec.source : initial || pluginTemplate(null);
  const ta = h('textarea', { class: 'code-editor', spellcheck: 'false', autocapitalize: 'off', autocomplete: 'off', value: source });
  const msg = h('div', { style: { marginTop: '10px' } });
  let modal = null;
  const save = () => {
    msg.textContent = '';
    try {
      const r = saveUserPlugin(ta.value, rec ? rec.key : null, rec ? rec.fileName : '');
      toast('插件已保存并加载：' + r.ids.map((id) => (Plugins.byId.get(id) || {}).name || id).join('、'), 'success');
      modal.close();
    } catch (err) {
      msg.append(errorBox(err, '无法加载'));
    }
  };
  ta.addEventListener('keydown', (ev) => {
    if (ev.key === 'Tab') {
      ev.preventDefault();
      const s = ta.selectionStart, en = ta.selectionEnd;
      ta.setRangeText('  ', s, en, 'end');
    } else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') {
      ev.preventDefault();
      save();
    }
  });
  modal = openModal({
    title: rec ? '编辑插件 · ' + rec.name : '新建插件',
    wide: true,
    body: [h('p', { class: 'muted small', style: { marginTop: 0 } }, '代码保存在浏览器本地（localStorage），刷新页面后自动加载。', h('span', { class: 'kbd' }, 'Ctrl/⌘ + S'), ' 保存。插件代码在页面中直接执行，请只运行你信任的代码。'), ta, msg],
    footer: [
      h('button', { class: 'btn ghost', onclick: () => downloadText(((rec && rec.fileName) || 'my-plugin.js').replace(/(\.js)?$/, '.js'), ta.value, 'text/javascript;charset=utf-8') }, icon('download', 15), '下载 .js'),
      h('div', { class: 'grow' }),
      h('button', { class: 'btn ghost', onclick: () => modal.close() }, '取消'),
      h('button', { class: 'btn', onclick: save }, icon('check', 15), '保存并加载'),
    ],
  });
  setTimeout(() => ta.focus(), 0);
}
async function importPluginFiles(files) {
  for (const f of files) {
    try {
      const r = saveUserPlugin(await f.text(), null, f.name);
      toast('已导入插件 ' + f.name + '（' + r.ids.join('、') + '）', 'success');
    } catch (err) {
      toast('导入 ' + f.name + ' 失败：' + err.message, 'error');
    }
  }
}

/* =====================================================================
 * 启动
 * ===================================================================== */
function bindDnD() {
  let depth = 0;
  const ov = $('#dropOverlay');
  const hasFiles = (ev) => ev.dataTransfer && Array.from(ev.dataTransfer.types || []).includes('Files');
  window.addEventListener('dragenter', (ev) => { if (!hasFiles(ev)) return; ev.preventDefault(); depth++; ov.classList.add('show'); });
  window.addEventListener('dragover', (ev) => { if (!hasFiles(ev)) return; ev.preventDefault(); ev.dataTransfer.dropEffect = 'copy'; });
  window.addEventListener('dragleave', (ev) => { if (!hasFiles(ev)) return; depth = Math.max(0, depth - 1); if (!depth) ov.classList.remove('show'); });
  window.addEventListener('drop', (ev) => {
    if (!hasFiles(ev)) return;
    ev.preventDefault();
    depth = 0;
    ov.classList.remove('show');
    handleDrop(ev.dataTransfer).catch((err) => toast('读取失败：' + err.message, 'error'));
  });
}
function boot() {
  Charts.init();
  $('#searchBox').prepend(icon('search', 15));
  $('#dropOverlayInner').prepend(icon('upload', 22));
  $('#btnSidebar').append(icon('menu', 18));
  $('#btnOpen').replaceChildren(icon('folder', 15), h('span', { class: 'hide-sm' }, '打开文件夹'));
  updatePluginButton();
  updateThemeButton();
  $('#btnOpen').addEventListener('click', openFolder);
  $('#btnPlugins').addEventListener('click', () => openPluginManager());
  $('#btnTheme').addEventListener('click', () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
  $('#btnSidebar').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
  $('#dirInput').addEventListener('change', onDirInput);
  $('#pluginInput').addEventListener('change', (ev) => { const fs = Array.from(ev.target.files || []); ev.target.value = ''; importPluginFiles(fs); });
  let searchTimer = 0;
  $('#search').addEventListener('input', (ev) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { state.search = ev.target.value.trim(); renderTree(); }, 120);
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.ctrlKey || ev.metaKey || ev.altKey || $('.modal-overlay')) return;
    if (ev.target.closest && ev.target.closest('input, textarea, select, [contenteditable="true"]')) return;
    if (ev.key === 'j') { ev.preventDefault(); stepFile(1); }
    else if (ev.key === 'k') { ev.preventDefault(); stepFile(-1); }
    else if (ev.key === '/') { ev.preventDefault(); $('#search').focus(); }
  });
  bindDnD();
  renderSidebar();
  renderMain();
  if (!window.echarts) toast('ECharts 未能加载（vendor/echarts.min.js 缺失且无法访问 CDN），图表不可用', 'error', { sticky: true });
  // plugins/ 下的内置插件在 load 之前注册完毕，之后再加载本地（用户）插件，使其可以覆盖同 id 的内置插件
  window.addEventListener('load', loadUserPlugins);
}

window.CSVViewer = {
  version: VERSION,
  registerPlugin,
  loadScripts,
  utils: U,
  h,
  DataTable,
  get plugins() { return Plugins.sorted().map((p) => ({ id: p.id, name: p.name, enabled: Plugins.isEnabled(p.id) })); },
};
boot();
})();
